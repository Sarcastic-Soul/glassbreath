# Builds Glassbreath for Linux, Windows and macOS (Apple Silicon).
# - Every push to main and every pull request: build and keep the files as
#   workflow artifacts (Actions tab > run > Artifacts).
# - Pushing a tag like v0.2.0: also publish them to a GitHub Release.
# Builds are unsigned. See README for how to open them on Windows and macOS.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only pushes don't need new builds. (Path filters don't apply to tags.)
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-14
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # electron-builder downloads Electron and its packaging tools from
      # GitHub releases. Cache them, and retry when GitHub answers 504.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-dl-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-dl-${{ runner.os }}-

      - name: Package
        shell: bash
        run: |
          node build.mjs
          for try in 1 2 3; do
            npx electron-builder ${{ matrix.target }} --publish never && exit 0
            echo "electron-builder failed (try $try of 3), retrying in 30 s"
            sleep 30
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: glassbreath-${{ runner.os }}
          path: |
            out/*.AppImage
            out/*.deb
            out/*.exe
            out/*.dmg
            out/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
